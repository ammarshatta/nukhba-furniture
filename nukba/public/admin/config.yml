backend:
  name: github
  repo: ammarshatta/nukhba-furniture
  branch: master
  base_url: https://api.netlify.com
  auth_endpoint: auth
  auth_scope: repo
  site_domain: nukhba-furniture.ammar-shata.workers.dev

# Uncomment the line below to use the CMS locally without GitHub:
# (run "npx decap-server" in a second terminal alongside "npm run dev")
# local_backend: true

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: products
    label: Products
    folder: src/content/products
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    fields:
      - { label: Title (EN), name: title, widget: string }
      - { label: Title (AR), name: titleAr, widget: string }
      - { label: Slug, name: slug, widget: string }
      - label: Category
        name: category
        widget: select
        options: [living-room, bedroom, dining, office, outdoor]
      - { label: Excerpt (EN, 160 chars), name: excerpt, widget: text }
      - { label: Excerpt (AR), name: excerptAr, widget: text }
      - { label: Price (display), name: price, widget: string, hint: "e.g. EGP 45,000" }
      - { label: Price (number), name: priceValue, widget: number }
      - { label: Currency, name: currency, widget: string, default: EGP }
      - label: Images
        name: images
        widget: list
        field: { label: Image URL, name: image, widget: string }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - label: Badge
        name: badge
        widget: select
        options: ['', new, sale, bestseller]
        default: ''
        required: false
      - label: Tags
        name: tags
        widget: list
        field: { label: Tag, name: tag, widget: string }
      - label: Materials
        name: materials
        widget: list
        field: { label: Material, name: material, widget: string }
      - label: Dimensions
        name: dimensions
        widget: object
        fields:
          - { label: Width, name: width, widget: number }
          - { label: Depth, name: depth, widget: number }
          - { label: Height, name: height, widget: number }
          - { label: Unit, name: unit, widget: string, default: cm }
      - { label: Description (body), name: body, widget: markdown }
      - { label: WhatsApp Message (EN), name: waText, widget: string }
      - { label: WhatsApp Message (AR), name: waTextAr, widget: string }
      - label: Related Products
        name: relatedProducts
        widget: list
        required: false
        field: { label: Product Slug, name: slug, widget: string }
      - label: Product FAQs
        name: faqs
        widget: list
        required: false
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }
      - { label: Active, name: active, widget: boolean, default: true }
      - { label: Publish Date, name: publishDate, widget: datetime }

  - name: categories
    label: Collections
    folder: src/content/categories
    create: true
    slug: "{{fields.slug}}"
    identifier_field: name
    fields:
      - { label: Name (EN), name: name, widget: string }
      - { label: Name (AR), name: nameAr, widget: string }
      - { label: Slug, name: slug, widget: string }
      - { label: Description (EN), name: description, widget: text }
      - { label: Description (AR), name: descriptionAr, widget: text }
      - { label: Hero Image, name: image, widget: string }
      - { label: Display Order, name: order, widget: number }

  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    fields:
      - { label: Title (EN), name: title, widget: string }
      - { label: Title (AR), name: titleAr, widget: string, required: false }
      - { label: Slug, name: slug, widget: string }
      - { label: Publish Date, name: publishDate, widget: datetime }
      - { label: Updated Date, name: updatedDate, widget: datetime, required: false }
      - { label: Author, name: author, widget: string, default: Nukhba Editorial }
      - label: Category
        name: category
        widget: select
        options: [guide, trends, tips, materials, spaces]
      - { label: Excerpt (160 chars max), name: excerpt, widget: text }
      - { label: Cover Image URL, name: coverImage, widget: string }
      - label: Tags
        name: tags
        widget: list
        field: { label: Tag, name: tag, widget: string }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Reading Time (min), name: readingTime, widget: number, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: faqs
    label: FAQs
    folder: src/content/faqs
    create: true
    identifier_field: question
    fields:
      - { label: Question (EN), name: question, widget: string }
      - { label: Question (AR), name: questionAr, widget: string, required: false }
      - { label: Answer (EN), name: answer, widget: text }
      - { label: Answer (AR), name: answerAr, widget: text, required: false }
      - label: Category
        name: category
        widget: select
        options: [general, products, delivery, customization]
      - { label: Display Order, name: order, widget: number }

  - name: locations
    label: Locations
    folder: src/content/locations
    create: true
    slug: "{{fields.slug}}"
    identifier_field: name
    fields:
      - { label: Name (EN), name: name, widget: string }
      - { label: Name (AR), name: nameAr, widget: string }
      - { label: Slug, name: slug, widget: string }
      - { label: City, name: city, widget: string }
      - { label: Area, name: area, widget: string }
      - { label: Address (EN), name: address, widget: string }
      - { label: Address (AR), name: addressAr, widget: string }
      - { label: Phone, name: phone, widget: string }
      - { label: WhatsApp Number, name: whatsapp, widget: string }
      - { label: Google Maps URL, name: googleMapsUrl, widget: string }
      - { label: Map Embed Src, name: mapEmbedSrc, widget: string }
      - { label: Opening Hours, name: hours, widget: string }
      - { label: Image URL, name: image, widget: string }
