name = "nukhba"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# pages_build_output_dir intentionally omitted here — pass via CLI:
#   wrangler pages deploy dist --project-name nukhba
# This avoids the reserved "ASSETS" binding name error from @astrojs/cloudflare
# during local builds (wrangler treats any config with pages_build_output_dir as
# a Pages project and rejects the ASSETS binding name it generates).

[vars]
PUBLIC_SITE_URL = "https://nukhba-furniture.ammar-shata.workers.dev"
PUBLIC_WA_NUMBER = "201112007555"
PUBLIC_INSTAGRAM_URL = "https://instagram.com/nukhba.eg"
PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN = ""
AI_MODEL = "claude-sonnet-4-6"
CLOUDINARY_UPLOAD_PRESET = "nukhba-products"
# Public OAuth client ID — not sensitive, safe to commit
GITHUB_CLIENT_ID = "Ov23liaz269sMqpDOK2c"

# Secrets — set ONLY via Cloudflare dashboard (encrypted) or:
#   wrangler pages secret put ADMIN_PASSWORD --project-name nukhba
#   wrangler pages secret put ADMIN_SESSION_SECRET --project-name nukhba
#   wrangler pages secret put ANTHROPIC_API_KEY --project-name nukhba
#   wrangler pages secret put CLOUDINARY_CLOUD_NAME --project-name nukhba
#   wrangler pages secret put GITHUB_CLIENT_SECRET --project-name nukhba
