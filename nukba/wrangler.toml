name = "nukhba-furniture"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# pages_build_output_dir intentionally omitted here — pass via CLI:
#   wrangler pages deploy dist --project-name nukhba
# This avoids the reserved "ASSETS" binding name error from @astrojs/cloudflare
# during local builds (wrangler treats any config with pages_build_output_dir as
# a Pages project and rejects the ASSETS binding name it generates).

[vars]
PUBLIC_SITE_URL = "https://shattafurniture.com"
PUBLIC_WA_NUMBER = "201040101056"
PUBLIC_INSTAGRAM_URL = "https://instagram.com/shatta_furniture"
PUBLIC_FACEBOOK_URL = "https://www.facebook.com/citymodern"
PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN = ""
AI_MODEL = "claude-sonnet-4-6"
CLOUDINARY_UPLOAD_PRESET = "shatta-products"
# Google Analytics 4
PUBLIC_GA4_ID = "G-XBFR0B2XBK"
# Microsoft Clarity (heatmaps + session recordings)
PUBLIC_CLARITY_ID = "x6d58609c6"
# Testing kill-switch: "true" = noindex the whole site. Set "false" at launch.
PUBLIC_NOINDEX = "false"
# Public OAuth client ID — not sensitive, safe to commit
GITHUB_CLIENT_ID = "Ov23liaz269sMqpDOK2c"
# NOTE: GITHUB_CLIENT_SECRET intentionally NOT defined here. Setting it as an
# empty/placeholder var here is what wiped it on every deploy. Set it ONCE as an
# ENCRYPTED SECRET (persists across deploys): see comment block below.

# Secrets — set ONLY via Cloudflare dashboard (encrypted) or:
#   wrangler secret put GITHUB_CLIENT_SECRET --name nukhba-furniture
#   wrangler secret put ADMIN_PASSWORD --name nukhba-furniture
#   wrangler secret put ADMIN_SESSION_SECRET --name nukhba-furniture
#   wrangler secret put ANTHROPIC_API_KEY --name nukhba-furniture
#   wrangler secret put CLOUDINARY_CLOUD_NAME --name nukhba-furniture
